name: lighting
version: "1.0"
description: "Dramatic lighting control - illumination, shadows, atmosphere"
category: controls

triggers:
  - illuminates
  - lights
  - glowing
  - neon
  - sunset
  - sunrise
  - moonlight
  - candlelight
  - spotlight
  - backlit
  - silhouette
  - golden hour

prompt:
  suffix: "dramatic lighting, volumetric rays, atmospheric depth"
  keywords:
    - rim lighting
    - light rays
    - ambient occlusion

params:
  guidance_bias: 0.8
  contrast: 1.15

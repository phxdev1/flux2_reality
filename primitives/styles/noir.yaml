name: noir
version: "1.0"
description: "Dark, high-contrast noir aesthetic with moody shadows and dramatic lighting"
category: styles

triggers:
  - noir
  - dark
  - shadow
  - detective
  - rain
  - moody
  - contrast
  - black and white
  - film noir
  - dramatic lighting

# Assets (placeholder paths - create these when training)
# embedding: noir.embed.pt
# weights: noir.safetensors

params:
  guidance_bias: 1.5
  contrast: 1.3
  saturation: 0.8
  num_steps_min: 40

inject:
  modulation: true
  cross_attention: true

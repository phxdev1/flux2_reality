name: noir
version: "1.0"
description: "Dark, high-contrast noir aesthetic with moody shadows and dramatic lighting"
category: styles

triggers:
  - noir
  - dark
  - shadow
  - detective
  - rain
  - moody
  - contrast
  - black and white
  - film noir
  - dramatic lighting

# Prompt injection (no training needed!)
prompt:
  prefix: "film noir style, high contrast, dramatic shadows"
  suffix: "moody atmosphere, cinematic lighting, dark aesthetic"
  keywords:
    - chiaroscuro
    - atmospheric
    - mysterious
  negative:
    - bright
    - colorful
    - cheerful
    - saturated

params:
  guidance_bias: 1.5
  contrast: 1.3
  saturation: 0.7
  num_steps_min: 40

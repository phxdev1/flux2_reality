name: cyberpunk
version: "1.0"
description: "Cyberpunk aesthetic - neon lights, rain-slicked streets, dystopian future"
category: styles

triggers:
  - cyberpunk
  - neon
  - dystopia
  - futuristic
  - blade runner
  - synthwave
  - hologram
  - cyber
  - tech noir

prompt:
  prefix: "cyberpunk style, neon-lit dystopian cityscape"
  suffix: "rain reflections, holographic advertisements, high-tech low-life aesthetic"
  keywords:
    - fluorescent
    - chrome
    - urban decay
    - night city
  negative:
    - natural
    - rustic
    - pastoral
    - daylight

params:
  guidance_bias: 1.2
  contrast: 1.2
  saturation: 1.3
  num_steps_min: 40
